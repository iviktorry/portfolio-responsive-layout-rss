<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>portfolio-responsive-layout-rss</title>
    <script type="module" src="/src/scripts/main.js" defer></script>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="wrapper">
          <header class="header">
            <img src="./src/assets/logo.svg" class="header__logo" alt="logo" />
            <nav class="nav">
              <ul class="nav__list">
                <li class="nav__item">
                  <a href="#" class="nav__link">about me</a>
                </li>
                <li class="nav__item">
                  <a href="#" class="nav__link">portfolio</a>
                </li>
                <li class="nav__item">
                  <a href="#" class="nav__link">price</a>
                </li>
                <li class="nav__item">
                  <a href="#" class="nav__link">faq</a>
                </li>
                <li class="nav__item">
                  <a href="#" class="nav__link">contacts</a>
                </li>
              </ul>
            </nav>
          </header>
          <div class="hero__body">
            <aside class="hero__aside">
              <span>2025</span>
              <div class="hero__line"></div>
              <span>Best Photographer by MAX</span>
            </aside>
          </div>

          <div class="hero__content">
            <div class="hero__group">
              <div class="hero__stats">
                <div class="hero__stats-num">
                  <p class="hero__num">+487</p>
                  <p class="hero__text text">Photo sessions</p>
                </div>
                <div class="hero__stats-num">
                  <p class="hero__num">+356</p>
                  <p>Satisfied clients</p>
                </div>
              </div>
              <h1 class="hero__heading">Professional Photographer</h1>
              <p class="hero__label label">
                Capture the moment. Tell your story.
              </p>
            </div>

            <div class="hero__gallery">
              <img
                src="./src/assets/hero-1.svg"
                class="hero__img-1"
                alt="author photo"
              />
              <img
                src="./src/assets/hero-2.svg"
                class="hero__img-2"
                alt="author photo"
              />
            </div>

            <div class="hero__bio">
              <p class="hero__scroll text">
                Scroll down
                <img
                  src="./src/assets/arrow-down.svg"
                  class="hero__arrow-down"
                  alt="arrow down"
                />
              </p>

              <p class="hero__author text">
                Hi! I'm Vera, a photographer. For me, photography is more than
                just an image.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
